<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Echo Squad</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23070b16'/><circle cx='16' cy='16' r='10' fill='%2335e0ff'/><circle cx='16' cy='16' r='4' fill='%23070b16'/></svg>">
<style>
  :root{
    --bg:#070b16; --panel:#0e1629ee; --line:#22345c; --ink:#e8f1ff; --dim:#8fa3c8;
    --cyan:#35e0ff; --gold:#ffd166; --red:#ff5470; --green:#5dffb0; --violet:#b48cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}

  .topbtns{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:6px;z-index:5}
  .ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#0e162999;color:var(--ink);
    font:600 14px system-ui;display:grid;place-items:center;cursor:pointer;padding:0}
  .ib:hover{border-color:var(--cyan)}
  .ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,#070b16cc 0%,#070b16f2 80%);padding:16px;overflow:auto;touch-action:pan-y}
  .overlay.on{display:flex;animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
  .box{width:min(720px,100%);margin:auto;text-align:center}
  h1{font-size:clamp(26px,5vw,40px);margin:0 0 4px;letter-spacing:.04em;font-weight:800}
  h1 .c{color:var(--cyan);text-shadow:0 0 18px #35e0ff88}
  .sub{color:var(--dim);font-size:15px;margin:0 0 18px}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 12px 16px;cursor:pointer;
    color:var(--ink);font:inherit;animation:pop .28s ease-out backwards;transition:transform .12s,border-color .12s,box-shadow .12s;min-height:150px}
  .card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}
  .card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--hue,var(--cyan));box-shadow:0 8px 30px -8px var(--hue,var(--cyan));outline:none}
  .card .ico{width:46px;height:46px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;
    font-size:22px;font-weight:800;color:var(--bg);background:var(--hue,var(--cyan));box-shadow:0 0 18px -2px var(--hue,var(--cyan))}
  .card b{display:block;font-size:16px;margin-bottom:6px}
  .card span{display:block;color:var(--dim);font-size:13px;line-height:1.4}
  .card .tag{display:inline-block;margin-top:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hue,var(--cyan))}

  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px;align-items:center}
  .lbl{color:var(--dim);font-size:13px;width:100%;margin-bottom:-2px}
  .chip{border:1px solid var(--line);background:#0e1629;color:var(--ink);border-radius:999px;padding:8px 14px;font:600 13px system-ui;cursor:pointer}
  .chip.sel{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px -4px var(--cyan)}
  .chip.lock{opacity:.4;cursor:default}

  .btn{border:0;border-radius:14px;padding:14px 22px;font:700 16px system-ui;cursor:pointer;color:var(--bg);background:var(--cyan);
    box-shadow:0 6px 24px -8px var(--cyan);transition:transform .1s}
  .btn:hover{transform:translateY(-2px)} .btn:active{transform:none}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.ad{background:var(--gold);box-shadow:0 6px 24px -8px var(--gold)}
  .btn.ad::before{content:"▶ ";font-size:.8em}
  .btn[disabled]{opacity:.35;pointer-events:none}

  .stats{display:flex;gap:10px;justify-content:center;margin:14px 0 6px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 18px;min-width:104px}
  .stat i{display:block;font-style:normal;color:var(--dim);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .stat b{font-size:26px;font-variant-numeric:tabular-nums}
  .stat.gold b{color:var(--gold)} .stat.rec b{color:var(--green)}

  .shop{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px;text-align:left}
  .up{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    color:var(--ink);font:inherit;cursor:pointer}
  .up:hover{border-color:var(--gold)} .up[disabled]{opacity:.45;pointer-events:none}
  .up .n{flex:1;min-width:0} .up .n b{display:block;font-size:14px} .up .n span{font-size:12px;color:var(--dim)}
  .up .pips{letter-spacing:2px;color:var(--cyan);font-size:10px}
  .up .cost{font-weight:700;color:var(--gold);font-size:14px;white-space:nowrap}
  .note{color:var(--green);font-size:13px;min-height:18px;margin-top:10px}

  #toast{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);z-index:30;background:#0e1629f2;border:1px solid var(--line);
    padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.on{opacity:1}

  @media (max-width:700px){ body.playing #btnLang{display:none} }
  @media (max-width:560px){
    .cards{grid-template-columns:1fr;gap:8px}
    .card{display:grid;grid-template-columns:46px 1fr;column-gap:12px;text-align:left;min-height:0;padding:12px}
    .card .ico{margin:0;grid-row:1/4}.card .tag{margin-top:4px}
    .shop{grid-template-columns:1fr}
  }
  @media (max-height:520px){ h1{font-size:24px} .sub{margin-bottom:10px} .card{min-height:0;padding:12px} .stats{margin:8px 0 2px} .stat b{font-size:20px} }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="topbtns">
  <button class="ib" id="btnLang" aria-label="Language">EN</button>
  <button class="ib" id="btnMute" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
  <button class="ib" id="btnPause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
</div>

<!-- between-round upgrade pick -->
<div class="overlay" id="ovCards"><div class="box">
  <h1 id="cardsTitle"></h1><p class="sub" id="cardsSub"></p>
  <div class="cards" id="cardList"></div>
  <div class="row" id="classRow"></div>
  <div class="row"><button class="btn ad ghost" id="btnReroll"></button></div>
</div></div>

<!-- death: revive offer -->
<div class="overlay" id="ovDead"><div class="box">
  <h1 id="deadTitle"></h1><p class="sub" id="deadSub"></p>
  <div class="row"><button class="btn ad" id="btnRevive"></button><button class="btn ghost" id="btnGiveUp"></button></div>
</div></div>

<!-- results + permanent upgrades -->
<div class="overlay" id="ovResults"><div class="box">
  <h1 id="resTitle"></h1><p class="sub" id="resSub"></p>
  <div class="stats">
    <div class="stat"><i id="lblRound"></i><b id="resRound">0</b></div>
    <div class="stat rec"><i id="lblBest"></i><b id="resBest">0</b></div>
    <div class="stat gold"><i id="lblEarned"></i><b id="resCoins">0</b></div>
    <div class="stat gold"><i id="lblBank"></i><b id="resBank">0</b></div>
  </div>
  <div class="row"><button class="btn ad" id="btnDouble"></button><button class="btn" id="btnAgain"></button></div>
  <div class="note" id="resNote"></div>
  <div class="shop" id="shop"></div>
</div></div>

<!-- pause -->
<div class="overlay" id="ovPause"><div class="box">
  <h1 id="pauseTitle"></h1><p class="sub" id="pauseSub"></p>
  <div class="row"><button class="btn" id="btnResume"></button></div>
</div></div>

<div id="toast"></div>

<script src="js/ads.js"></script>
<script src="js/game.js"></script>
</body>
</html>
